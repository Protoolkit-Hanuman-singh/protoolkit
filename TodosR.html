<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List — ProToolkit Premium</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --accent3: #22d3ee;
    --text: #e8eaf6;
    --text2: #8b90b8;
    --danger: #f87171;
    --success: #34d399;
    --warning: #fbbf24;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
  .logo { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .tool-header { margin-bottom: 24px; }
  .tool-header h2 { font-size: 1.8rem; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tool-header p { color: var(--text2); margin-top: 4px; font-size: 0.95rem; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; overflow: auto; transition: all 0.3s; }
  .card:hover { border-color: var(--accent); }
  .card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 14px; color: var(--accent2); display: flex; align-items: center; gap: 8px; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 160px; }

  label { display: block; font-size: 0.82rem; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
  input, select, textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 0.9rem; outline: none; transition: all 0.2s; font-family: inherit; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,0.15); }
  textarea { resize: vertical; min-height: 60px; }
  select option { background: var(--surface); }

  .btn { padding: 9px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #5a52e0; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,99,255,0.35); }
  .btn-success { background: var(--success); color: #0a2a1e; }
  .btn-success:hover { background: #28b882; transform: translateY(-2px); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { transform: translateY(-2px); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: rgba(108,99,255,0.05); }
  .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; flex: 1; min-width: 120px; }
  .stat-num { font-size: 2rem; font-weight: 800; color: var(--accent2); }
  .stat-label { font-size: 0.8rem; color: var(--text2); margin-top: 4px; }

  .watermark-container { position: relative; overflow: hidden; }
  .watermark-text { 
    position: absolute; 
    bottom: 10px; 
    right: 10px; 
    font-size: 10px; 
    color: rgba(0,0,0,0.06); 
    font-weight: 700; 
    letter-spacing: 1px; 
    pointer-events: none; 
    transform: rotate(-10deg); 
    z-index: 10; 
    white-space: nowrap; 
    font-family: 'Segoe UI', sans-serif;
    user-select: none;
  }

  /* Watermark Settings */
  .wm-settings { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .wm-settings .col { min-width: 120px; }
  .wm-settings input[type="text"] { width: 100%; }
  .wm-settings input[type="number"] { width: 100%; }
  .wm-settings input[type="color"] { width: 44px; height: 38px; padding: 2px; border-radius: 6px; cursor: pointer; }

  .badge-recommended { background: linear-gradient(135deg, #f59e0b, #f97316); color: #fff; padding: 2px 10px; border-radius: 12px; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; margin-left: 6px; }

  /* Todo Items */
  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--surface2);
    border-radius: 8px;
    margin-bottom: 6px;
    border-left: 4px solid var(--accent);
    transition: all 0.3s;
  }
  .todo-item:hover { background: var(--surface); }
  .todo-item.done { opacity: 0.5; text-decoration: line-through; border-left-color: var(--success); }
  .todo-item .todo-text { flex: 1; font-size: 0.9rem; word-break: break-word; }
  .todo-item .todo-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.7rem; color: var(--text2); }
  .todo-item .todo-meta .priority-high { color: var(--danger); }
  .todo-item .todo-meta .priority-medium { color: var(--warning); }
  .todo-item .todo-meta .priority-low { color: var(--success); }
  .todo-item .todo-meta .category { background: var(--surface); padding: 1px 10px; border-radius: 12px; }
  .todo-item .todo-actions { display: flex; gap: 4px; }

  .filter-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filter-btn { padding: 4px 14px; border-radius: 16px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; font-size: 0.78rem; transition: all 0.2s; }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  @media (max-width: 768px) { 
    .grid-2 { grid-template-columns: 1fr; } 
    .container { padding: 12px; } 
    .card { padding: 14px; } 
    .col { min-width: 120px; }
    .wm-settings .col { min-width: 90px; }
    .todo-item { flex-wrap: wrap; }
    .todo-item .todo-meta { width: 100%; }
  }

  @media print { 
    .no-print { display: none !important; } 
    body { background: #fff; } 
    .watermark-text { color: rgba(0,0,0,0.12) !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface2); border-radius: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header no-print">
  <span class="logo">✅ To-Do List</span>
  <div class="header-right">
    <button class="btn btn-outline btn-sm" onclick="exportTodos()">📤 Export</button>
    <button class="btn btn-outline btn-sm" onclick="importTodos()">📥 Import</button>
  </div>
</div>

<div class="container">
  <div class="tool-header no-print">
    <h2>✅ Smart To-Do List <span class="badge-recommended">Local Storage</span></h2>
    <p>Priority • Categories • Due Date • Search • Filter</p>
  </div>

  <div class="grid-2">
    <!-- Left: Add Task -->
    <div>
      <div class="card">
        <h3>📝 Add New Task</h3>
        <div class="row">
          <div class="col" style="flex:2;min-width:200px;">
            <label>Task Description</label>
            <input id="todo-text" placeholder="What do you need to do?" onkeydown="if(event.key==='Enter') addTodo()">
          </div>
          <div class="col">
            <label>Category</label>
            <select id="todo-category">
              <option value="Work">💼 Work</option>
              <option value="Personal">🏠 Personal</option>
              <option value="Study">📚 Study</option>
              <option value="Health">💪 Health</option>
              <option value="Finance">💰 Finance</option>
              <option value="Other">📌 Other</option>
            </select>
          </div>
        </div>
        <div class="row" style="margin-top:10px;">
          <div class="col">
            <label>Priority</label>
            <select id="todo-priority">
              <option value="high">🔴 High</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="low">🟢 Low</option>
            </select>
          </div>
          <div class="col">
            <label>Due Date</label>
            <input type="date" id="todo-due">
          </div>
          <div class="col" style="flex:0.5;min-width:80px;display:flex;align-items:flex-end;">
            <button class="btn btn-primary" onclick="addTodo()" style="width:100%;">+ Add</button>
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div class="card">
        <h3>📊 Statistics</h3>
        <div class="row">
          <div class="stat-box"><div class="stat-num" id="todo-total">0</div><div class="stat-label">Total</div></div>
          <div class="stat-box"><div class="stat-num" id="todo-done">0</div><div class="stat-label">Done</div></div>
          <div class="stat-box"><div class="stat-num" id="todo-pending">0</div><div class="stat-label">Pending</div></div>
          <div class="stat-box"><div class="stat-num" id="todo-overdue">0</div><div class="stat-label">Overdue</div></div>
        </div>
      </div>

      <!-- Watermark Settings -->
      <div class="card">
        <h3>💧 Watermark Settings</h3>
        <div class="wm-settings">
          <div class="col"><label>Color</label><input type="color" id="wmColor" value="#000000" oninput="updateWatermark()"></div>
          <div class="col"><label>Rotation</label><input type="number" id="wmRotation" value="-10" min="-90" max="90" oninput="updateWatermark()"></div>
          <div class="col"><label>Opacity</label><input type="number" id="wmOpacity" value="0.06" min="0.01" max="0.5" step="0.01" oninput="updateWatermark()"></div>
          <div class="col"><label>Size</label><input type="number" id="wmSize" value="10" min="6" max="24" oninput="updateWatermark()"></div>
        </div>
        <div style="margin-top:6px;font-size:0.7rem;color:var(--text2);">
          💡 Watermark: <span id="wmPreview">✨ Created by Hanuman Singh ✨</span>
        </div>
      </div>
    </div>

    <!-- Right: Task List -->
    <div>
      <div class="card">
        <h3>📋 Your Tasks</h3>
        
        <!-- Filters -->
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
          <button class="filter-btn" data-filter="pending" onclick="setFilter('pending')">Pending</button>
          <button class="filter-btn" data-filter="done" onclick="setFilter('done')">Done</button>
          <button class="filter-btn" data-filter="high" onclick="setFilter('high')">🔴 High</button>
          <button class="filter-btn" data-filter="medium" onclick="setFilter('medium')">🟡 Medium</button>
          <button class="filter-btn" data-filter="low" onclick="setFilter('low')">🟢 Low</button>
          <button class="filter-btn" data-filter="overdue" onclick="setFilter('overdue')">⏰ Overdue</button>
        </div>
        
        <!-- Search -->
        <div style="margin-bottom:12px;">
          <input id="todo-search" placeholder="🔍 Search tasks..." oninput="renderTodos()">
        </div>
        
        <!-- Task List -->
        <div id="todo-list" style="max-height:500px;overflow-y:auto;"></div>
        
        <div class="btn-group" style="margin-top:12px;">
          <button class="btn btn-danger btn-sm" onclick="clearTodos()">🗑️ Clear All</button>
          <button class="btn btn-success btn-sm" onclick="clearDoneTodos()">✅ Clear Done</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// TO-DO LIST — with Local Storage, Priority, Categories
// ============================================================

// ----- GLOBAL STATE -----
let currentFilter = 'all';
let todos = [];

// ============================================================
// WATERMARK (Global)
// ============================================================
function updateWatermark() {
  const text = '✨ Created by Hanuman Singh ✨';
  const color = document.getElementById('wmColor').value;
  const rotation = parseFloat(document.getElementById('wmRotation').value) || -10;
  const opacity = parseFloat(document.getElementById('wmOpacity').value) || 0.06;
  const size = parseInt(document.getElementById('wmSize').value) || 10;

  document.querySelectorAll('.watermark-text').forEach(el => {
    el.textContent = text;
    el.style.transform = `rotate(${rotation}deg)`;
    el.style.fontSize = size + 'px';
    el.style.opacity = opacity;
    if (color.startsWith('#')) {
      const hex = color.replace('#', '');
      const r = parseInt(hex.substring(0,2), 16);
      const g = parseInt(hex.substring(2,4), 16);
      const b = parseInt(hex.substring(4,6), 16);
      el.style.color = `rgba(${r},${g},${b},${opacity})`;
    } else {
      el.style.color = color;
    }
  });
  document.getElementById('wmPreview').textContent = text;
}

// ============================================================
// LOCAL STORAGE
// ============================================================
function loadTodos() {
  try {
    const data = localStorage.getItem('protoolkit-todos');
    if (data) {
      todos = JSON.parse(data);
      // Convert string dates back to Date objects
      todos = todos.map(t => ({
        ...t,
        due: t.due || null
      }));
    } else {
      // Add sample todos
      todos = [
        { id: Date.now(), text: 'Complete project report', category: 'Work', priority: 'high', due: getDateDays(3), done: false },
        { id: Date.now() + 1, text: 'Gym workout', category: 'Health', priority: 'medium', due: getDateDays(1), done: false },
        { id: Date.now() + 2, text: 'Read book chapter', category: 'Study', priority: 'low', due: getDateDays(5), done: true }
      ];
      saveTodos();
    }
  } catch(e) {
    todos = [];
  }
  renderTodos();
}

function saveTodos() {
  try {
    localStorage.setItem('protoolkit-todos', JSON.stringify(todos));
  } catch(e) {
    console.error('Error saving todos:', e);
  }
}

function getDateDays(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

// ============================================================
// ADD / DELETE / TOGGLE
// ============================================================
function addTodo() {
  const text = document.getElementById('todo-text').value.trim();
  if (!text) {
    alert('Please enter a task!');
    return;
  }
  
  const category = document.getElementById('todo-category').value;
  const priority = document.getElementById('todo-priority').value;
  const due = document.getElementById('todo-due').value;
  
  todos.unshift({
    id: Date.now(),
    text: text,
    category: category,
    priority: priority,
    due: due || null,
    done: false,
    createdAt: new Date().toISOString()
  });
  
  saveTodos();
  document.getElementById('todo-text').value = '';
  document.getElementById('todo-due').value = '';
  renderTodos();
}

function toggleTodo(id) {
  const todo = todos.find(t => t.id === id);
  if (todo) {
    todo.done = !todo.done;
    saveTodos();
    renderTodos();
  }
}

function deleteTodo(id) {
  if (confirm('Delete this task?')) {
    todos = todos.filter(t => t.id !== id);
    saveTodos();
    renderTodos();
  }
}

function clearTodos() {
  if (confirm('Delete all tasks?')) {
    todos = [];
    saveTodos();
    renderTodos();
  }
}

function clearDoneTodos() {
  const doneCount = todos.filter(t => t.done).length;
  if (doneCount === 0) {
    alert('No completed tasks to clear!');
    return;
  }
  if (confirm(`Delete ${doneCount} completed tasks?`)) {
    todos = todos.filter(t => !t.done);
    saveTodos();
    renderTodos();
  }
}

// ============================================================
// FILTERS
// ============================================================
function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  renderTodos();
}

// ============================================================
// RENDER TODOS
// ============================================================
function renderTodos() {
  const search = document.getElementById('todo-search').value.toLowerCase().trim();
  const list = document.getElementById('todo-list');
  if (!list) return;
  
  // Apply filters
  let filtered = [...todos];
  
  // Search filter
  if (search) {
    filtered = filtered.filter(t => t.text.toLowerCase().includes(search));
  }
  
  // Status filter
  if (currentFilter === 'pending') {
    filtered = filtered.filter(t => !t.done);
  } else if (currentFilter === 'done') {
    filtered = filtered.filter(t => t.done);
  } else if (currentFilter === 'high') {
    filtered = filtered.filter(t => t.priority === 'high');
  } else if (currentFilter === 'medium') {
    filtered = filtered.filter(t => t.priority === 'medium');
  } else if (currentFilter === 'low') {
    filtered = filtered.filter(t => t.priority === 'low');
  } else if (currentFilter === 'overdue') {
    const today = new Date().toISOString().split('T')[0];
    filtered = filtered.filter(t => !t.done && t.due && t.due < today);
  }
  
  // Sort: pending first, then by priority
  filtered.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const priorityOrder = { high: 0, medium: 1, low: 2 };
    return (priorityOrder[a.priority] || 1) - (priorityOrder[b.priority] || 1);
  });
  
  // Render
  if (filtered.length === 0) {
    list.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--text2);">
      <div style="font-size:2rem;margin-bottom:8px;">📭</div>
      <p>No tasks found</p>
      <p style="font-size:0.8rem;">Add a new task or change your filters</p>
    </div>`;
  } else {
    list.innerHTML = filtered.map(t => {
      const isDone = t.done ? 'done' : '';
      const priorityClass = `priority-${t.priority}`;
      const priorityLabel = t.priority === 'high' ? '🔴' : t.priority === 'medium' ? '🟡' : '🟢';
      const isOverdue = !t.done && t.due && t.due < new Date().toISOString().split('T')[0];
      
      // Category emoji
      const catEmojis = {
        'Work': '💼', 'Personal': '🏠', 'Study': '📚', 
        'Health': '💪', 'Finance': '💰', 'Other': '📌'
      };
      const catEmoji = catEmojis[t.category] || '📌';
      
      return `
        <div class="todo-item ${isDone}">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${t.id})" style="width:18px;height:18px;cursor:pointer;flex-shrink:0;">
          <span class="todo-text">${t.text}</span>
          <div class="todo-meta">
            <span class="category">${catEmoji} ${t.category}</span>
            <span class="${priorityClass}">${priorityLabel} ${t.priority}</span>
            ${t.due ? `<span>📅 ${formatDate(t.due)}${isOverdue ? ' ⏰' : ''}</span>` : ''}
            ${isOverdue ? '<span style="color:var(--danger);font-weight:700;">OVERDUE</span>' : ''}
          </div>
          <div class="todo-actions">
            <button class="btn btn-danger btn-sm" onclick="deleteTodo(${t.id})">✕</button>
          </div>
        </div>
      `;
    }).join('');
  }
  
  // Update stats
  updateStats();
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const today = new Date();
  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  
  const dStr = d.toISOString().split('T')[0];
  const tStr = today.toISOString().split('T')[0];
  const tmStr = tomorrow.toISOString().split('T')[0];
  const yStr = yesterday.toISOString().split('T')[0];
  
  if (dStr === tStr) return 'Today';
  if (dStr === tmStr) return 'Tomorrow';
  if (dStr === yStr) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
}

function updateStats() {
  const total = todos.length;
  const done = todos.filter(t => t.done).length;
  const pending = total - done;
  const today = new Date().toISOString().split('T')[0];
  const overdue = todos.filter(t => !t.done && t.due && t.due < today).length;
  
  document.getElementById('todo-total').textContent = total;
  document.getElementById('todo-done').textContent = done;
  document.getElementById('todo-pending').textContent = pending;
  document.getElementById('todo-overdue').textContent = overdue;
}

// ============================================================
// EXPORT / IMPORT
// ============================================================
function exportTodos() {
  if (todos.length === 0) {
    alert('No tasks to export!');
    return;
  }
  const data = JSON.stringify(todos, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `todos_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importTodos() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const imported = JSON.parse(ev.target.result);
        if (Array.isArray(imported) && imported.length > 0) {
          if (confirm(`Import ${imported.length} tasks? (This will replace current tasks)`)) {
            todos = imported;
            saveTodos();
            renderTodos();
            alert(`✅ ${imported.length} tasks imported successfully!`);
          }
        } else {
          alert('Invalid file format!');
        }
      } catch(err) {
        alert('Error reading file: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  loadTodos();
  updateWatermark();
  // Set default due date to tomorrow
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  document.getElementById('todo-due').value = tomorrow.toISOString().split('T')[0];
});

window.addEventListener('load', function() {
  renderTodos();
  updateWatermark();
});
</script>
