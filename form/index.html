<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jankari Form</title>
<style>
body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:16px;background:#f5f6f8}
h2{margin:0 0 8px}
label{display:block;margin:12px 0 4px;font-size:14px;font-weight:600}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:8px;font-size:16px}
button{width:100%;margin-top:16px;padding:12px;font-size:16px;border:0;border-radius:8px;background:#0a7d4b;color:#fff}
button:disabled{opacity:.5}
#msg{margin-top:12px;padding:10px;border-radius:8px;display:none}
.ok{background:#d8f5e3;color:#075}.err{background:#fde0e0;color:#a00}
.c{font-weight:400;display:flex;gap:8px;align-items:flex-start}
.c input{width:auto;margin-top:3px}
.hp{position:absolute;left:-9999px}
</style></head><body>
<h2>Jankari bhariye</h2>
<form id="f" novalidate>
<label>Naam</label><input id="name" maxlength="80" autocomplete="name">
<label>Phone (10 digit)</label><input id="phone" maxlength="10" inputmode="numeric" autocomplete="tel">
<label>Email</label><input id="email" type="email" maxlength="100" autocomplete="email">
<label>Height (cm)</label><input id="height" inputmode="decimal" maxlength="5">
<label>Weight (kg)</label><input id="weight" inputmode="decimal" maxlength="5">
<label>Note (optional)</label><textarea id="note" maxlength="500" rows="3"></textarea>
<label>Image (JPG/PNG)</label><input id="img" type="file" accept="image/jpeg,image/png">
<label>PDF (max 2 MB)</label><input id="pdf" type="file" accept="application/pdf">
<div class="hp"><input id="website" tabindex="-1" autocomplete="off"></div>
<label class="c"><input type="checkbox" id="ok"> Main apni jankari aur files jama karne ki sahmati deta/deti hoon.</label>
<button id="btn" type="submit">Submit</button>
<div id="msg"></div>
</form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://caltdexduajdoflyaaed.supabase.co",SB_KEY="sb_publishable_RSvb0KLkgixqdMJN_8NLNw_RGKYaK9i";
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
const $=id=>document.getElementById(id);
const show=(t,c)=>{const m=$('msg');m.textContent=t;m.className=c;m.style.display='block'};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function retry(fn){let e;for(let i=0;i<4;i++){try{return await fn()}catch(x){e=x;await sleep(1000*(i+1)+Math.random()*1000)}}throw e}
async function compress(file){
let src,w,h,u=null;
try{src=await createImageBitmap(file,{imageOrientation:'from-image'});w=src.width;h=src.height}
catch(e){u=URL.createObjectURL(file);src=new Image();src.src=u;await src.decode();w=src.naturalWidth;h=src.naturalHeight}
const M=1400;
if(Math.max(w,h)>M){const k=M/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
const c=document.createElement('canvas');c.width=w;c.height=h;
const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(src,0,0,w,h);
if(u)URL.revokeObjectURL(u);
return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('compress fail')),'image/jpeg',0.75))}
$('f').addEventListener('submit',async e=>{
e.preventDefault();
if($('website').value)return;
const d={name:$('name').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),note:$('note').value.trim(),height:$('height').value.trim(),weight:$('weight').value.trim()};
const img=$('img').files[0],pdf=$('pdf').files[0];let er='';
if(d.name.length<2)er='Naam likhiye';
else if(!/^[6-9]\d{9}$/.test(d.phone))er='Sahi 10 digit phone number likhiye';
else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email))er='Sahi email likhiye';
else if(!(+d.height>=50&&+d.height<=250))er='Height 50 se 250 cm ke beech likhiye';
else if(!(+d.weight>=10&&+d.weight<=300))er='Weight 10 se 300 kg ke beech likhiye';
else if(!img||!['image/jpeg','image/png'].includes(img.type))er='JPG ya PNG image chuniye';
else if(!pdf||pdf.type!=='application/pdf')er='PDF file chuniye';
else if(pdf.size>2*1024*1024)er='PDF 2 MB se chhoti honi chahiye';
else if(!$('ok').checked)er='Sahmati ka box tick kijiye';
if(er)return show(er,'err');
const btn=$('btn');btn.disabled=true;show('Upload ho raha hai, ruko...','ok');
try{
const id=crypto.randomUUID();
let blob=null,ct='image/jpeg',ext='jpg';
try{blob=await compress(img)}catch(_){}
if(!blob||blob.size<3000){if(img.size>2*1024*1024)throw new Error('Image kharab ya badi hai, doosri image chuniye');blob=img;ct=img.type;ext=img.type==='image/png'?'png':'jpg'}
if(blob.size>2*1024*1024)throw new Error('Image bahut badi hai');
const ip=id+'/photo.'+ext,pp=id+'/doc.pdf';
const up=(p,b,t)=>retry(async()=>{const{error}=await sb.storage.from('docs').upload(p,b,{contentType:t,upsert:false});if(error&&!/exists|duplicate/i.test(error.message))throw error});
await up(ip,blob,ct);
await up(pp,pdf,'application/pdf');
await retry(async()=>{const{error}=await sb.from('submissions').insert({id,...d,file_path:ip,pdf_path:pp});if(error&&error.code!=='23505')throw error});
$('f').reset();show('Upload ho gaya. Dhanyavaad!','ok');
}catch(x){show('Dikkat aayi: '+(x.message||x)+'. Dobara try kijiye.','err')}
btn.disabled=false;
});
</script></body></html>
